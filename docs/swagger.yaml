  /api/user/secret/post-binary-secret:
    post:
      consumes:
      - application/json
      description: Stores a new binary secret (file) for the authenticated user. Data
        should be base64-encoded.
      parameters:
      - description: Binary secret data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/request.BinarySecret'
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
