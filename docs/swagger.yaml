      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: required fields missing or invalid
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete text secret
      tags:
      - secrets
  /api/user/secret/get-all-secrets:
    get:
      description: Returns all stored secrets (login-passwords, text, binary, cards)
        for the current user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.AllSecrets'
        "401":
          description: unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get all secrets
      tags:
      - secrets
  /api/user/secret/get-binary-secret:
    get:
      description: Returns all stored binary secrets for the current user
      produces:
      - application/json
      responses:
        "200":
          description: OK
