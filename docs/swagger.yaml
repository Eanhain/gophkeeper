basePath: /v1
definitions:
  request.BinarySecret:
    properties:
      data:
        example: LS0tLS1CRUdJTi...
        type: string
      filename:
        example: certificate.pem
        type: string
      mime_type:
        example: application/x-pem-file
        type: string
    type: object
  request.CardSecret:
    properties:
      brand:
        example: Visa
        type: string
      cardholder:
        example: John Doe
        type: string
      exp_month:
        example: "12"
        type: string
      exp_year:
        example: "2027"
        type: string
      last4:
        example: "1111"
        type: string
      pan:
        example: "4111111111111111"
        type: string
    type: object
  request.DeleteBinarySecret:
    properties:
      filename:
        example: certificate.pem
        type: string
    type: object
  request.DeleteCardSecret:
    properties:
      cardholder:
        example: John Doe
        type: string
    type: object
  request.DeleteLoginPassword:
    properties:
      login:
        example: admin@example.com
        type: string
    type: object
  request.DeleteTextSecret:
    properties:
      title:
        example: API key
        type: string
    type: object
  request.LoginPassword:
    properties:
      label:
        example: work email
        type: string
      login:
        example: admin@example.com
        type: string
      password:
        example: myP@ssw0rd
        type: string
    type: object
  request.TextSecret:
    properties:
      body:
        example: sk-proj-abc123...
        type: string
      title:
        example: API key
        type: string
    type: object
  request.UserInput:
    properties:
      login:
        example: john_doe
        type: string
      password:
        example: s3cureP@ss
        type: string
    type: object
  response.AllSecrets:
    properties:
      binary_secret:
        items:
          $ref: '#/definitions/response.BinarySecret'
        type: array
      card_secret:
        items:
          $ref: '#/definitions/response.CardSecret'
        type: array
      login_password:
        items:
          $ref: '#/definitions/response.LoginPassword'
        type: array
      text_secret:
        items:
          $ref: '#/definitions/response.TextSecret'
        type: array
    type: object
  response.BinarySecret:
    properties:
      data:
        example: LS0tLS1CRUdJTi...
        type: string
      filename:
        example: certificate.pem
        type: string
      mime_type:
        example: application/x-pem-file
        type: string
    type: object
  response.CardSecret:
    properties:
      brand:
        example: Visa
        type: string
      cardholder:
        example: John Doe
        type: string
      exp_month:
        example: "12"
        type: string
      exp_year:
        example: "2027"
        type: string
      last4:
        example: "1111"
        type: string
      pan:
        example: "4111111111111111"
        type: string
    type: object
  response.LoginPassword:
    properties:
      label:
        example: work email
        type: string
      login:
        example: admin@example.com
        type: string
      password:
        example: myP@ssw0rd
        type: string
    type: object
  response.TextSecret:
    properties:
      body:
        example: sk-proj-abc123...
        type: string
      title:
        example: API key
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: |-
    GophKeeper — secure vault for passwords, text notes, binary data and bank cards.
    All request/response bodies under /v1 are AES-256-GCM encrypted (Content-Type: application/octet-stream).
    Decrypt the response body with the shared crypto key to obtain JSON.
  title: Gophkeeper API
  version: "1.0"
paths:
  /api/user/delete-user:
    delete:
      consumes:
      - application/json
      description: Deletes the currently authenticated user's account
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete user
      tags:
      - auth
  /api/user/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user by login and password, returns a signed JWT
        token
      parameters:
      - description: User credentials
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/request.UserInput'
      produces:
      - application/json
      responses:
        "200":
          description: token
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User login
      tags:
      - auth
  /api/user/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account, authenticates it and returns a JWT
        token
      parameters:
      - description: New user credentials
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/request.UserInput'
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: user already exists
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register user
      tags:
      - auth
  /api/user/secret/delete-binary-secret:
    delete:
      consumes:
      - application/json
      description: Deletes a stored binary secret identified by the filename field
      parameters:
      - description: Filename identifier to delete
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/request.DeleteBinarySecret'
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: required fields missing or invalid
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete binary secret
      tags:
      - secrets
  /api/user/secret/delete-card-secret:
    delete:
      consumes:
      - application/json
      description: Deletes a stored card secret identified by the cardholder field
      parameters:
      - description: Cardholder identifier to delete
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/request.DeleteCardSecret'
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: required fields missing or invalid
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete card secret
      tags:
      - secrets
  /api/user/secret/delete-login-password:
    delete:
      consumes:
      - application/json
      description: Deletes a stored login-password secret identified by the login
        field
      parameters:
      - description: Login identifier to delete
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/request.DeleteLoginPassword'
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: required fields missing or invalid
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete login-password
      tags:
      - secrets
  /api/user/secret/delete-text-secret:
    delete:
      consumes:
      - application/json
      description: Deletes a stored text secret identified by the title field
      parameters:
      - description: Title identifier to delete
        in: body
        name: input
        required: true
        schema:
